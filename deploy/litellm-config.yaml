model_list:
  - model_name: gpt-4.1-mini
    litellm_params:
      model: openai/gpt-4.1-mini
      api_key: os.environ/OPENAI_API_KEY

guardrails:
  - guardrail_name: presidio-tr
    litellm_params:
      guardrail: presidio
      mode: pre_call
      default_on: true
      presidio_language: tr
      output_parse_pii: true
      # Varsayılan "both" cevabı da tarar ve geri açılan değerleri yeniden maskeler; yalnızca girdiyi maskele.
      presidio_filter_scope: input
      presidio_analyzer_api_base: http://presidio-analyzer:3000
      presidio_anonymizer_api_base: http://presidio-anonymizer:3000

  # Log kopyasını maskeler (canlı isteğe dokunmaz); geri açılan cevap Langfuse'a ham PII olarak gitmesin.
  - guardrail_name: presidio-tr-logs
    litellm_params:
      guardrail: presidio
      mode: logging_only
      default_on: true
      presidio_filter_scope: input
      presidio_language: tr
      presidio_analyzer_api_base: http://presidio-analyzer:3000
      presidio_anonymizer_api_base: http://presidio-anonymizer:3000

litellm_settings:
  success_callback: ["langfuse"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
