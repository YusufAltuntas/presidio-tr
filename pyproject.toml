[project]
name = "presidio-tr"
version = "0.1.0"
description = "Turkish PII recognizers for Microsoft Presidio (unofficial community package)"
readme = "README_EN.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Yusuf Altuntaş" }]
keywords = ["presidio", "pii", "turkish", "anonymization", "tckn", "vkn", "iban", "kvkk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Turkish",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["presidio-analyzer>=2.2.360,<2.3"]

[project.urls]
Homepage = "https://github.com/YusufAltuntas/presidio-tr"
Issues = "https://github.com/YusufAltuntas/presidio-tr/issues"

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "python-stdnum>=1.20",
    "faker>=30",
    "fastapi>=0.115",
    "httpx>=0.27",
]
benchmark = [
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presidio_tr"]

[tool.hatch.build.targets.sdist]
include = ["src/presidio_tr", "README.md", "README_EN.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # uzun satırları formatter böler; uzun metin sabitleri kalabilir

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["e2e: compose ayaktayken çalışan uçtan uca testler"]
addopts = "-m 'not e2e'"
